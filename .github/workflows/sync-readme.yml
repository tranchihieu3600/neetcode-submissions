name: Sync LeetCode README

# Kích hoạt mỗi khi có sự kiện đẩy code lên nhánh main
on:
  push:
    branches:
      - main

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền ghi để action có thể commit file mới

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetch script
        run: python fetch_readme.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: Tự động thêm README.md đề bài từ API"
          file_pattern: "*/README.md"